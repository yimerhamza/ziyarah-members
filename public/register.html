<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ZIYARAH BUSINESS GROUP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand {
            display: inline-block;
            background: #1a365d;
            color: white;
            padding: 6px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 28px;
            color: #1a202c;
        }

        .header h1 span {
            color: #1a365d;
        }

        .header p {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .form-group label .required {
            color: #e53e3e;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            background: #f7fafc;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1a365d;
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background: #1a365d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: #15304f;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(26, 54, 93, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 16px;
            padding: 14px 16px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #f0fff4;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .message.error {
            display: block;
            background: #fff5f5;
            color: #9b2c2c;
            border: 1px solid #feb2b2;
        }

        .message.loading {
            display: block;
            background: #ebf8ff;
            color: #2a69ac;
            border: 1px solid #90cdf4;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #718096;
        }

        .login-link a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #1a365d;
        }

        .terms {
            font-size: 12px;
            color: #a0aec0;
            text-align: center;
            margin-top: 16px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 24px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Home</a>

        <div class="header">
            <div class="brand">✦ ZIYARAH BUSINESS GROUP</div>
            <h1>Member <span>Registration</span></h1>
            <p>Join our business community</p>
        </div>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First name <span class="required">*</span></label>
                    <input type="text" id="firstName" placeholder="Jane" required />
                </div>
                <div class="form-group">
                    <label>Last name <span class="required">*</span></label>
                    <input type="text" id="lastName" placeholder="Doe" required />
                </div>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" placeholder="jane@company.com" required />
                <small style="color:#a0aec0;font-size:12px;">We'll send your membership confirmation to this email</small>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone" placeholder="+1 234 567 890" />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Company</label>
                    <input type="text" id="company" placeholder="Acme Inc." />
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="position" placeholder="Marketing Manager" />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="dob" />
                </div>
                <div class="form-group">
                    <label>Membership Type</label>
                    <select id="membershipType">
                        <option value="Regular">Regular</option>
                        <option value="Premium">Premium</option>
                        <option value="VIP">VIP</option>
                        <option value="Corporate">Corporate</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                ✦ Register Now
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Already a member? <a href="/admin">Login here</a>
        </div>

        <div class="terms">
            By registering, you agree to our terms of service and privacy policy.
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const firstName = document.getElementById('firstName');
        const lastName = document.getElementById('lastName');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const company = document.getElementById('company');
        const position = document.getElementById('position');
        const dob = document.getElementById('dob');
        const membershipType = document.getElementById('membershipType');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    messageEl.className = 'message';
                    messageEl.textContent = '';
                }, 6000);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const data = {
                firstName: firstName.value.trim(),
                lastName: lastName.value.trim(),
                email: email.value.trim(),
                phone: phone.value.trim(),
                company: company.value.trim(),
                position: position.value.trim(),
                dob: dob.value,
                membershipType: membershipType.value
            };

            // Validate
            if (!data.firstName) { showMessage('First name is required.', 'error'); return; }
            if (!data.lastName) { showMessage('Last name is required.', 'error'); return; }
            if (!data.email) { showMessage('Email is required.', 'error'); return; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering...';
            showMessage('Submitting your registration...', 'loading');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Registration failed');
                }

                showMessage('✅ ' + result.message, 'success');
                form.reset();
                submitBtn.textContent = '✓ Registered Successfully!';
                
                // Reset button after 3 seconds
                setTimeout(() => {
                    submitBtn.textContent = '✦ Register Now';
                    submitBtn.disabled = false;
                }, 3000);

            } catch (err) {
                showMessage('❌ ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '✦ Register Now';
            }
        });
    </script>
</body>
</html>
